services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
      - internal
    environment:
      DB_HOST: db
      DB_NAME: tienda
      DB_USER: tienda_user
      DB_PASS: tienda_pass123
    networks:
      - labnet

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda_user
      MYSQL_PASSWORD: tienda_pass123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - labnet

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - labnet

  # Servicio interno NO publicado al host: simula un servicio/metadata interno
  # solo alcanzable desde la red docker (objetivo para la práctica de SSRF).
  internal:
    image: php:8.1-cli
    volumes:
      - ./internal:/app
    working_dir: /app
    command: php -S 0.0.0.0:9000 -t /app
    networks:
      - labnet

networks:
  labnet:
    driver: bridge

volumes:
  db_data:
